<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我的台股情報站</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #1f4e79;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .stock-card {
      background: white;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .stock-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .section {
      margin-top: 14px;
      line-height: 1.7;
    }

    .news-link {
      color: #1565c0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📈我的台股情報站</h1>

  <div class="subtitle">
    自選股每日重點新聞與AI摘要
  </div>

  <div class="stock-card">

    <div class="stock-name">
      台積電（2330）
    </div>

    <div class="section">
      📊<strong>最新營收／股價動態：</strong><br>
      股票資料功能建置中。
    </div>

    <div class="section">
      🚀<strong>營運與重大發展：</strong><br>
      AI新聞摘要功能建置中。
    </div>

    <div class="section">
      🔗<strong>新聞原文連結：</strong><br>
      新聞搜尋功能建置中。
    </div>

  </div>

</div>

</body>
</html>
