name: Test News Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install googlenewsdecoder
          pip install -U google-genai

      - name: Run news data script
        run: python scripts/news_data.py

      - name: Generate AI summaries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_summary.py

      - name: Save news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data.json
          git diff --cached --quiet || git commit -m "Update news data and AI summaries"
          git push
