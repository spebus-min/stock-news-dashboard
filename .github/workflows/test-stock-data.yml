name: Test Stock Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run stock data script
        run: python scripts/stock_data.py

      - name: Save market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          git diff --cached --quiet || git commit -m "Update market data"
          git push
